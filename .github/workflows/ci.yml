name: ci

# Checks only. This workflow holds no secrets and never calls Azure.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements.txt
      # A hook can be skipped on a laptop. This step cannot be skipped.
      - run: python -m scripts.leak_scan
      - run: ruff check .
      - run: pytest tests -q
